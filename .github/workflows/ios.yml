name: Build the Fruit VR iPhone app
# Builds ios/ into an unsigned FruitVR.ipa for sideloading (AltStore, SideStore, Sideloadly), which sign it with your own Apple ID.
on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Make the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project FruitVR.xcodeproj -scheme FruitVR -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 60
      - name: Package the .ipa
        run: |
          cd ios
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/FruitVR.app Payload/
          zip -qr FruitVR.ipa Payload
          ls -la FruitVR.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: FruitVR-unsigned-ipa
          path: ios/FruitVR.ipa
          if-no-files-found: error
